name: hueleaf-android
on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
    paths:
      - "android/**"
      - ".github/workflows/hueleaf-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/hueleaf-android.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a separate signed APK Release"
        type: boolean
        default: false
      version_name:
        description: "Android versionName"
        type: string
        default: "1.0.0"
      version_code:
        description: "Increasing Android versionCode"
        type: string
        default: "1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        working-directory: android/hueleaf-remote
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hueleaf-android-debug
          path: android/hueleaf-remote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android signing secrets first.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hueleaf-release.jks"
          echo "HUELEAF_ANDROID_KEYSTORE=$RUNNER_TEMP/hueleaf-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android/hueleaf-remote
        env:
          HUELEAF_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HUELEAF_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUELEAF_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HUELEAF_ANDROID_STORE_PASSWORD"
          test -n "$HUELEAF_ANDROID_KEY_ALIAS"
          test -n "$HUELEAF_ANDROID_KEY_PASSWORD"
          ./gradlew assembleRelease "-PhueleafVersionName=$VERSION_NAME" "-PhueleafVersionCode=$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose "$APK"
      - name: Publish APK independently of firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Android Release already exists; refusing to replace it.' >&2
            exit 1
          fi
          APK="$RUNNER_TEMP/hueleaf-remote-$VERSION_NAME.apk"
          cp android/hueleaf-remote/app/build/outputs/apk/release/app-release.apk "$APK"
          flags=()
          case "$VERSION_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "HueLeaf Android $VERSION_NAME" \
            --generate-notes "${flags[@]}" "$APK"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hueleaf-release.jks"
